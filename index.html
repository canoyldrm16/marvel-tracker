        // Veri Yapısı: LocalStorage Yönetimi
        let userProgress = JSON.parse(localStorage.getItem('marvel_progress_v2')) || {};

        function initProgress() {
            rawData.forEach(item => {
                if (!userProgress[item.id]) {
                    if (item.type === 'movie') {
                        userProgress[item.id] = false;
                    } else {
                        userProgress[item.id] = new Array(item.episodes).fill(false);
                    }
                }
            });
        }
        initProgress();

        function saveProgress() {
            localStorage.setItem('marvel_progress_v2', JSON.stringify(userProgress));
            renderApp();
        }

        // Süre Hesaplama Yardımcısı
        function formatMinutes(totalMins) {
            const hrs = Math.floor(totalMins / 60);
            const mins = totalMins % 60;
            if (hrs === 0) return `${mins} dk`;
            if (mins === 0) return `${hrs} sa`;
            return `${hrs} sa ${mins} dk`;
        }

        function renderApp() {
            const container = document.getElementById('itemsContainer');
            container.innerHTML = '';

            let totalGlobalMins = 0;
            let watchedGlobalMins = 0;
            let totalItemCount = rawData.length;
            let completedItemCount = 0;

            const searchQuery = document.getElementById('searchInput').value.toLowerCase();
            const filterType = document.getElementById('filterSelect').value;

            rawData.forEach(item => {
                // Süre hesapları
                let itemTotalMins = item.type === 'movie' ? item.duration : (item.episodes * item.durationPerEp);
                totalGlobalMins += itemTotalMins;

                let itemWatchedMins = 0;
                let isItemFullyCompleted = false;

                if (item.type === 'movie') {
                    if (userProgress[item.id]) {
                        itemWatchedMins = item.duration;
                        isItemFullyCompleted = true;
                    }
                } else {
                    const eps = userProgress[item.id] || [];
                    const watchedCount = eps.filter(Boolean).length;
                    itemWatchedMins = watchedCount * item.durationPerEp;
                    if (watchedCount === item.episodes) {
                        isItemFullyCompleted = true;
                    }
                }

                if (isItemFullyCompleted) completedItemCount++;
                watchedGlobalMins += itemWatchedMins;

                // Filtreleme Kontrolleri
                const matchesSearch = item.title.toLowerCase().includes(searchQuery);
                let matchesFilter = true;
                if (filterType === 'movie') matchesFilter = item.type === 'movie';
                if (filterType === 'series') matchesFilter = item.type === 'series';
                if (filterType === 'watched') matchesFilter = isItemFullyCompleted;
                if (filterType === 'unwatched') matchesFilter = !isItemFullyCompleted;

                if (!matchesSearch || !matchesFilter) return;

                // Kart HTML Oluşturma
                const card = document.createElement('div');
                card.className = `bg-gray-900/90 border ${isItemFullyCompleted ? 'border-emerald-500/40 shadow-lg shadow-emerald-500/5' : 'border-gray-800'} rounded-2xl p-4 sm:p-5 transition-all`;

                let percent = 0;
                if (item.type === 'movie') {
                    percent = userProgress[item.id] ? 100 : 0;
                } else {
                    const eps = userProgress[item.id] || [];
                    const watchedCount = eps.filter(Boolean).length;
                    percent = Math.round((watchedCount / item.episodes) * 100);
                }

                // Kalan süre hesaplama (Sezon/Film bazlı)
                const remainingMins = itemTotalMins - itemWatchedMins;

                let contentHtml = `

                                </svg>
                            </div>
                            <div>
                                <span class="text-xs font-medium text-gray-500">#${item.id}</span>
                                <h3 class="text-base font-bold text-white leading-snug">${item.title}</h3>
                            </div>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="toggleItemFull(${item.id})" class="px-2.5 py-1 text-xs font-semibold rounded-lg bg-gray-800 hover:bg-gray-700 text-gray-300 border border-gray-700 transition">
                                ${isItemFullyCompleted ? 'Geri Al' : 'Tümünü İzle'}
                            </button>
                            ${item.type === 'series' ? `
                                <button onclick="toggleAccordion(${item.id})" class="w-8 h-8 rounded-lg bg-gray-800 hover:bg-gray-700 text-gray-300 flex items-center justify-center transition">
                                    <svg id="chevron-${item.id}" class="w-4 h-4 transform transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                                </button>
                            ` : ''}
                        </div>
                    </div>

                    <!-- Meta Bilgiler -->
                    <div class="flex items-center gap-4 text-xs text-gray-400 mb-3 flex-wrap">
                        <span class="bg-gray-800/80 px-2.5 py-1 rounded-md border border-gray-700/50">${item.type === 'movie' ? `Film • ${item.duration} dk` : `Dizi • ${item.episodes} Bölüm (~${item.durationPerEp} dk/bölüm)`}</span>
                        <span class="text-emerald-400 font-medium">${percent}% Tammlandı</span>
                    </div>

                    <!-- İlerleme Çubuğu ve Kalan Süre -->
                    <div class="mb-3">
                        <div class="flex justify-between text-xs text-gray-400 mb-1">
                            <span>Kalan Süre: <strong class="text-rose-400">${formatMinutes(remainingMins)}</strong></span>
                            <span>Toplam: ${formatMinutes(itemTotalMins)}</span>
                        </div>
                        <div class="w-full bg-gray-800 h-2 rounded-full overflow-hidden">
                            <div class="bg-gradient-to-r from-red-600 to-emerald-500 h-full transition-all duration-300" style="width: ${percent}%"></div>
                        </div>
                    </div>
                `;

                // Eğer diziyse bölüm listesi ekle
                if (item.type === 'series') {
                    contentHtml += `
                        <div id="episodes-${item.id}" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-2 mt-3 pt-3 border-t border-gray-800/80">
                    `;
                    for (let i = 0; i < item.episodes; i++) {
                        const isEpWatched = userProgress[item.id][i];
                        contentHtml += `
                            <button onclick="toggleEpisode(${item.id}, ${i})" class="flex items-center justify-between px-3 py-2 rounded-xl text-xs font-medium border transition ${isEpWatched ? 'bg-emerald-950/30 border-emerald-500/40 text-emerald-300' : 'bg-gray-800/40 border-gray-700/50 text-gray-400 hover:bg-gray-800 hover:text-gray-200'}">
                                <span>${i + 1}. Bölüm</span>
                                <div class="w-4 h-4 rounded border ${isEpWatched ? 'bg-emerald-500 border-emerald-500 text-white flex items-center justify-center' : 'border-gray-600'} text-[10px]">
                                    ${isEpWatched ? '✓' : ''}
                                </div>
                            </button>
                        `;
                    }
                    contentHtml += `</div>`;
                }

                card.innerHTML = contentHtml;
                container.appendChild(card);
            });

        // Global İstatistikleri Güncelle
            document.getElementById('statTotalItems').innerText = totalItemCount;
            document.getElementById('statWatchedItems').innerText = completedItemCount;
            document.getElementById('statTotalTime').innerText = formatMinutes(totalGlobalMins);
            document.getElementById('statRemainingTime').innerText = formatMinutes(totalGlobalMins - watchedGlobalMins);

            const globalPercentVal = Math.round((watchedGlobalMins / totalGlobalMins) * 100) || 0;
            document.getElementById('globalPercent').innerText = globalPercentVal + '%';
            document.getElementById('globalProgressBar').style.width = globalPercentVal + '%';
        }

        function toggleEpisode(itemId, epIndex) {
            userProgress[itemId][epIndex] = !userProgress[itemId][epIndex];
            saveProgress();
        }

        function toggleItemFull(itemId) {
            const item = rawData.find(i => i.id === itemId);
            if (item.type === 'movie') {
                userProgress[itemId] = !userProgress[itemId];
            } else {
                const eps = userProgress[itemId];
                const allWatched = eps.every(Boolean);
                userProgress[itemId] = new Array(item.episodes).fill(!allWatched);
            }
            saveProgress();
        }

        function toggleAll(status) {
            rawData.forEach(item => {
                if (item.type === 'movie') {
                    userProgress[item.id] = status;
                } else {
                    userProgress[item.id] = new Array(item.episodes).fill(status);
                }
            });
            saveProgress();
        }

        function resetAll() {
            if (confirm('Tüm ilerlemeniz sıfırlanacak. Emin misiniz?')) {
                localStorage.removeItem('marvel_progress_v2');
                userProgress = {};
                initProgress();
                saveProgress();
            }
        }

        function filterItems() {
            renderApp();
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(userProgress));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "marvel_tracker_backup.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importData(event) {
            const fileReader = new FileReader();
            if (event.target.files[0]) {
                fileReader.readAsText(event.target.files[0], "UTF-8");
                fileReader.onload = (e) => {
                    try {
                        userProgress = JSON.parse(e.target.result);
                        saveProgress();
                        alert('Veriler başarıyla içe aktarıldı!');
                    } catch (err) {
                        alert('Geçersiz dosya formatı!');
                    }
                };
            }
        }

        // İlk Çalıştırma
        renderApp();
    </script>
</body>
</html>
